<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DHARANI — intelligent land-record verification and property trust." />
  <title>DHARANI — Land Records</title>
  <style>
    :root{--deep:#032f24;--green:#0f3d2e;--mid:#07533c;--accent:#42e69d;--mint:#dff7ec;--bg:#e7ece9;--surface:#e7ece9;--text:#17231f;--muted:#6f7c76;--red:#a44a55;--yellow:#8a6d23;--shadow:18px 20px 40px rgba(80,94,88,.25),-11px -11px 26px rgba(255,255,255,.9)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{min-height:100vh}.public{min-height:100vh;background:linear-gradient(135deg,#032e23,#064b37 52%,#073f31);color:#fff}.public-inner{width:min(1250px,calc(100% - 64px));min-height:100vh;margin:auto;display:flex;flex-direction:column}.public-nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:19px;letter-spacing:.7px}.brand-mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#9bf5ca;border:1px solid rgba(150,255,211,.42);background:rgba(255,255,255,.055);box-shadow:7px 8px 18px rgba(0,0,0,.25)}.nav-actions{display:flex;gap:10px}.hero{flex:1;display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:72px;padding:40px 0 55px}.eyebrow{font-size:10px;letter-spacing:1px;color:#aef7d2;margin-bottom:18px}.hero h1{font-size:clamp(43px,5.3vw,76px);line-height:1;letter-spacing:-3px;margin:0 0 22px}.hero p{max-width:650px;color:#bfe9d7;font-size:15px;line-height:1.75}.actions{display:flex;gap:12px;margin-top:26px}.btn{border:0;border-radius:14px;padding:12px 18px;font-size:12px;font-weight:750;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn-green{background:linear-gradient(145deg,#a4f7d2,#72e9b8);color:#063b2b;box-shadow:9px 11px 24px rgba(0,0,0,.28)}.btn-glass{color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(173,255,222,.3)}.map-card{min-height:440px;border-radius:28px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(62,231,157,.18),transparent 34%),linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));border:1px solid rgba(181,255,223,.2);box-shadow:18px 22px 46px rgba(0,0,0,.32)}.map-orbit{position:absolute;border:1px solid rgba(112,245,190,.1);border-radius:50%;left:50%;top:47%;transform:translate(-50%,-50%)}.o1{width:290px;height:290px}.o2{width:385px;height:385px}.map{width:285px;height:325px;position:relative;z-index:2;filter:drop-shadow(0 0 18px rgba(47,236,150,.23))}.map path{fill:#11865a;stroke:#55efad;stroke-width:2}.pin{fill:#71f5ba;filter:drop-shadow(0 0 7px #3be996)}.map-label{position:absolute;right:24px;bottom:22px;padding:12px 15px;border-radius:17px;background:rgba(2,53,38,.6);border:1px solid rgba(161,255,215,.13);font-size:11px;color:#eafff4}.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(2,52,38,.4);border:1px solid rgba(168,255,218,.13);border-radius:27px;padding:18px;margin-bottom:34px}.metric{text-align:center;padding:10px;border-right:1px solid rgba(166,255,219,.13)}.metric:last-child{border-right:0}.metric b{display:block;color:#7af0ba;font-size:21px}.metric span{font-size:10px;color:#a9d7c4}
    .shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.sidebar{background:var(--surface);padding:22px 14px;position:fixed;inset:0 auto 0 0;width:232px;display:flex;flex-direction:column;box-shadow:11px 0 32px rgba(73,88,81,.19);z-index:5}.side-nav{display:flex;flex-direction:column;gap:5px;margin-top:20px}.side-nav button{border:0;background:transparent;color:#5f6c67;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px}.side-nav button:hover{background:#dce8e2;color:var(--green)}.side-nav button.active{background:var(--green);color:#fff}.logout{margin-top:auto}.main{margin-left:232px;min-width:0}.topbar{height:72px;position:sticky;top:0;z-index:4;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:0 32px;box-shadow:0 8px 22px rgba(80,94,88,.08)}.search{width:min(430px,48vw);border:0;background:var(--surface);padding:11px 14px;border-radius:12px;box-shadow:inset 5px 5px 12px rgba(112,125,119,.2),inset -5px -5px 12px rgba(255,255,255,.88);outline:0}.user{display:flex;gap:10px;align-items:center;font-size:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800;box-shadow:6px 6px 14px rgba(112,125,119,.22)}.page{padding:28px 32px 45px;max-width:1350px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:24px}.page h1{font-size:25px;margin:0 0 5px}.subtitle{font-size:12px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.card,.stat{background:var(--surface);border:0;border-radius:16px;box-shadow:var(--shadow)}.stat{padding:17px}.stat-label{font-size:11px;color:var(--muted)}.stat-value{display:block;font-size:24px;margin-top:9px}.card-head{padding:17px 18px;border-bottom:1px solid rgba(112,125,119,.13);display:flex;justify-content:space-between;align-items:center}.card-body{padding:18px}.property{display:grid;grid-template-columns:58px 1fr auto auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(112,125,119,.13)}.property:last-child{border-bottom:0}.thumb{width:58px;height:46px;border-radius:9px;background:linear-gradient(135deg,#7c9b82,#d7d0ab);box-shadow:inset 4px 4px 10px rgba(80,94,88,.2),inset -4px -4px 10px rgba(255,255,255,.7)}.property-title{font-size:12px;font-weight:750;margin-bottom:4px}.meta{font-size:10px;color:var(--muted);line-height:1.5}.badge{padding:6px 9px;border-radius:7px;font-size:9px;font-weight:800;white-space:nowrap}.green{background:var(--mint);color:#16844a}.yellow{background:#f5edd4;color:var(--yellow)}.red{background:#f9e6e8;color:var(--red)}.blue{background:#e7f0ff;color:#3464a8}.link{border:0;background:transparent;color:var(--green);font-size:11px;font-weight:750}.quick{padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{border:0;background:var(--surface);border-radius:12px;padding:15px;text-align:left;color:var(--green);box-shadow:inset 5px 5px 12px rgba(112,125,119,.16),inset -5px -5px 12px rgba(255,255,255,.75)}.quick b{display:block;font-size:11px;margin-bottom:4px}.quick span{font-size:10px;color:var(--muted)}.form{padding:22px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:11px;font-weight:750;color:#43504b}input,select{border:0;background:var(--surface);border-radius:10px;padding:11px 12px;box-shadow:inset 5px 5px 12px rgba(112,125,119,.2),inset -5px -5px 12px rgba(255,255,255,.88);outline:0;font-size:11px;color:#394640}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px;padding-top:18px;border-top:1px solid rgba(112,125,119,.13)}.btn-primary{background:var(--green);color:#fff}.btn-secondary{background:var(--surface);color:var(--green);box-shadow:6px 6px 14px rgba(112,125,119,.22),-6px -6px 14px rgba(255,255,255,.9)}.notice{background:#fff8e8;border:1px solid #f1e5c3;border-radius:10px;padding:12px;font-size:10px;color:#766332;margin-top:16px}.passport-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.info label{display:block;font-size:9px;color:#8b9792;margin-bottom:4px}.info b{font-size:11px;word-break:break-word}.timeline{padding:0 20px 20px}.event{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(112,125,119,.1)}.dot{width:20px;height:20px;border-radius:50%;background:#e4f7ed;color:#15934f;display:grid;place-items:center;flex:none}.toast{position:fixed;right:25px;bottom:25px;background:var(--green);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:20}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef6f1,#d6e9dc);padding:30px}.login-card{width:min(430px,100%);background:var(--surface);border-radius:22px;padding:32px;box-shadow:var(--shadow)}.login-card h1{margin:10px 0 6px}.login-card p{font-size:12px;color:var(--muted);line-height:1.6}.login-card .field{margin:14px 0}.login-card .btn{width:100%}.otp{display:flex;gap:8px}.otp input{flex:1}.status{padding:16px;border-radius:12px;background:#f2f8f5;margin-bottom:16px}
    @media(max-width:950px){.hero{grid-template-columns:1fr;text-align:center;gap:35px}.hero p{margin:0 auto}.actions{justify-content:center}.map-card{justify-self:center;width:min(600px,100%)}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.shell{grid-template-columns:70px 1fr}.sidebar{width:70px;padding:18px 8px}.sidebar .brand span,.side-nav span,.logout span{display:none}.side-nav button{justify-content:center}.main{margin-left:70px}.grid{grid-template-columns:repeat(2,1fr)}.grid2,.passport-grid{grid-template-columns:1fr}}
    @media(max-width:620px){.public-inner{width:calc(100% - 28px)}.public-nav{padding-top:18px}.hero{padding-top:25px}.hero h1{font-size:clamp(38px,11vw,52px)}.metrics{border-radius:20px}.page{padding:22px 18px}.page-head{align-items:flex-start;flex-direction:column}.grid,.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.property{grid-template-columns:50px 1fr auto}.property .badge{display:none}.topbar{padding:0 18px}.search{width:55vw}.quick{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
