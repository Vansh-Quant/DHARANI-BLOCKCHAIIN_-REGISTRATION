<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DHARANI — Live Presentation</title>
  <style>
    :root{--green:#0f3d2e;--green2:#145541;--mint:#dff7ec;--accent:#22c55e;--bg:#e7ece9;--surface:#e7ece9;--text:#17231f;--muted:#6f7c76;--red:#a44a55;--yellow:#8a6d23;--shadow:18px 20px 40px rgba(80,94,88,.25),-11px -11px 26px rgba(255,255,255,.9);--inset:inset 5px 5px 12px rgba(112,125,119,.2),inset -5px -5px 12px rgba(255,255,255,.88)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{min-height:100vh}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;width:100%}.sidebar{background:var(--surface);padding:22px 14px;position:fixed;inset:0 auto 0 0;width:232px;display:flex;flex-direction:column;box-shadow:11px 0 32px rgba(73,88,81,.19),-7px -7px 20px rgba(255,255,255,.82);z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:19px;letter-spacing:.7px}.brand-mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#9bf5ca;border:1px solid rgba(150,255,211,.42);background:rgba(255,255,255,.055);box-shadow:7px 8px 18px rgba(0,0,0,.25)}.side-nav{display:flex;flex-direction:column;gap:5px;margin-top:20px}.side-nav button{border:0;background:transparent;color:#5f6c67;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px}.side-nav button:hover{background:#dce8e2;color:var(--green)}.side-nav button.active{background:var(--green);color:#fff}.logout{margin-top:auto}
    .main{position:relative;width:auto;min-width:0;margin-left:0}.topbar{height:72px;position:sticky;top:0;z-index:4;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:0 32px;box-shadow:0 8px 22px rgba(80,94,88,.08)}.search{width:min(430px,48vw);border:0;background:var(--surface);padding:11px 14px;border-radius:12px;box-shadow:var(--inset);outline:0}.user{display:flex;gap:10px;align-items:center;font-size:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800;box-shadow:6px 6px 14px rgba(112,125,119,.22)}.page{width:auto;max-width:1350px;margin:0 auto;padding:28px 32px 45px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:24px}.page h1{font-size:25px;margin:0 0 5px}.page h2{font-size:16px;margin:0}.subtitle,.meta{font-size:11px;color:var(--muted);line-height:1.5}.eyebrow{font-size:10px;letter-spacing:1px;color:#82908a;margin-bottom:7px}
    .card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.card-head{padding:17px 18px;border-bottom:1px solid rgba(112,125,119,.13);display:flex;justify-content:space-between;align-items:center}.card-body{padding:18px}.property{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(112,125,119,.13)}.property:last-child{border-bottom:0}.thumb{width:58px;height:46px;border-radius:9px;background:linear-gradient(135deg,#7c9b82,#d7d0ab);box-shadow:var(--inset)}.property b{font-size:12px}.badge{padding:6px 9px;border-radius:7px;font-size:9px;font-weight:800;white-space:nowrap}.badge.green{background:var(--mint);color:#16844a}.badge.yellow{background:#f5edd4;color:var(--yellow)}.badge.blue{background:#e7f0ff;color:#3464a8}.btn{border:0;border-radius:10px;padding:11px 16px;font-size:11px;font-weight:800}.btn-primary{background:var(--green);color:#fff;box-shadow:6px 7px 15px rgba(80,94,88,.22)}.btn-primary:hover{transform:translateY(-1px)}
    .form{padding:22px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:11px;font-weight:750;color:#43504b}.field input,.field select{width:100%;border:0;background:var(--surface);border-radius:10px;padding:11px 12px;box-shadow:var(--inset);outline:0;font-size:11px;color:#394640}.field input[readonly]{opacity:.85}.otp{display:flex;gap:9px}.otp input{flex:1}.notice{background:#fff8e8;border:1px solid #f1e5c3;border-radius:10px;padding:12px;font-size:10px;color:#766332;margin-top:16px}
    .login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef6f1,#d6e9dc);padding:30px}.login-card{width:min(460px,100%);background:var(--surface);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.login-card h1{font-size:30px;margin:12px 0 7px;letter-spacing:-.8px}.login-card p{font-size:12px;color:var(--muted);line-height:1.6}.login-card .btn-primary{width:100%;margin-top:4px}.login-card .brand-mark{width:42px;height:42px}.login-card .eyebrow{margin-top:20px;color:var(--green)}
    .timeline{padding:18px 20px 22px}.event{display:flex;gap:12px;position:relative;padding:0 0 18px}.event:not(:last-child):before{content:"";position:absolute;left:9px;top:19px;bottom:0;width:1px;background:#cfe4d9}.dot{width:19px;height:19px;border-radius:50%;background:#e4f7ed;border:1px solid #b9e2cc;z-index:1;flex:none;display:grid;place-items:center;font-size:9px;color:#15934f}.toast{position:fixed;right:25px;bottom:25px;background:var(--green);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:30;font-size:11px}
    .presentation-banner{position:fixed;right:18px;bottom:18px;z-index:100;padding:9px 13px;border-radius:999px;background:#0f3d2e;color:#fff;font-size:10px;font-weight:800;letter-spacing:.7px;box-shadow:0 10px 25px rgba(0,0,0,.2)}
    @media(max-width:950px){.shell{grid-template-columns:70px minmax(0,1fr)}.sidebar{width:70px;padding:18px 8px}.sidebar .brand{justify-content:center}.sidebar .brand span,.side-nav span,.logout span{display:none}.side-nav button{justify-content:center}.page{max-width:none}.topbar{padding:0 18px}.property{grid-template-columns:52px minmax(0,1fr) auto}.property .thumb{width:52px}.property .btn{display:none}}
    @media(max-width:620px){.page{padding:22px 16px}.page-head{align-items:flex-start;flex-direction:column}.property{grid-template-columns:48px minmax(0,1fr)}.property .badge{display:none}.login{padding:18px}.login-card{padding:25px}.presentation-banner{right:10px;bottom:10px;font-size:8px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden"></div>
  <div class="presentation-banner">DHARANI • LIVE PRESENTATION</div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="demo.js?v=20260912"></script>
</body>
</html>
